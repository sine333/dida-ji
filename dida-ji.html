<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FDF6E3" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%2363B3ED' d='M32 4C22 18 14 28 14 40a18 18 0 0 0 36 0C50 28 42 18 32 4Z'/%3E%3Cpath fill='%23fff' opacity='.85' d='M25 26c-5 4-7 9-5 15 1 3 3 5 5 6-1-7 1-13 7-19 1-2-4-4-7-2Z'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>滴答记 · DiDa Ji</title>
  <style>
    :root {
      --sea: #2B6CB0;
      --sky: #63B3ED;
      --gold: #D4A017;
      --cream: #FDF6E3;
      --white: #FFFFFF;
      --ink: #2D3748;
      --muted: #718096;
      --line: rgba(99, 179, 237, 0.25);
      --glow: 0 4px 20px rgba(43, 108, 176, 0.08);
      --strong-glow: 0 18px 46px rgba(43, 108, 176, 0.16);
      --radius: 16px;
      color-scheme: light;
      font-family: "Inter", "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 18% 4%, rgba(99, 179, 237, 0.22), transparent 30%),
        radial-gradient(circle at 92% 12%, rgba(212, 160, 23, 0.13), transparent 28%),
        linear-gradient(180deg, #FFFBEE 0%, var(--cream) 48%, #EEF8FF 100%);
      color: var(--ink);
    }

    body {
      overflow-x: hidden;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      position: relative;
      width: min(100%, 520px);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom));
      overflow: hidden;
    }

    .app-shell::before {
      content: "";
      position: fixed;
      inset: -120px auto auto 50%;
      width: 420px;
      height: 420px;
      transform: translateX(-50%);
      pointer-events: none;
      background:
        repeating-radial-gradient(circle, rgba(99, 179, 237, 0.14) 0 1px, transparent 1px 28px),
        radial-gradient(circle, rgba(255, 255, 255, 0.7), transparent 68%);
      opacity: 0.8;
      animation: breathe 7s ease-in-out infinite;
    }

    .page {
      position: relative;
      z-index: 1;
      animation: floatIn 220ms ease-out both;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 6px 0 12px;
    }

    .date-kicker {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    h2 {
      font-size: 18px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    h3 {
      font-size: 15px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .brand-drop {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: transparent;
      display: inline-grid;
      place-items: center;
      line-height: 1;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .brand-drop span {
      font-size: 35px;
      filter: drop-shadow(0 7px 12px rgba(43, 108, 176, 0.18));
    }

    .brand-drop:active {
      transform: scale(0.94);
    }

    .brand-drop.active span {
      filter: drop-shadow(0 8px 16px rgba(43, 108, 176, 0.28));
    }

    .soft-card,
    .meal-card,
    .mood-card,
    .bowel-card,
    .export-panel,
    .calendar-panel {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius);
      box-shadow: var(--glow);
      backdrop-filter: blur(14px);
    }

    .milestone-strip {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      margin: 8px 0 16px;
      color: #7A5800;
      background: linear-gradient(100deg, rgba(253, 246, 227, 0.94), rgba(255, 246, 194, 0.9), rgba(231, 244, 255, 0.9));
      border: 1px solid rgba(212, 160, 23, 0.28);
      overflow: hidden;
    }

    .milestone-strip::after {
      content: "";
      position: absolute;
      inset: auto -40px -18px;
      height: 46px;
      background: radial-gradient(ellipse at 20% 0, rgba(212, 160, 23, 0.28), transparent 54%);
      animation: waveSlide 3.8s ease-in-out infinite;
    }

    .milestone-strip strong {
      position: relative;
      z-index: 1;
      font-size: 14px;
    }

    .sync-card {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
      padding: 12px 14px;
      margin: 2px 0 14px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(99, 179, 237, 0.18);
      border-radius: var(--radius);
      box-shadow: var(--glow);
      backdrop-filter: blur(14px);
      animation: floatIn 180ms ease-out both;
    }

    .sync-top,
    .sync-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sync-copy {
      min-width: 0;
    }

    .sync-actions .sync-note {
      flex: 1 1 180px;
    }

    .sync-title {
      color: var(--sea);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
    }

    .sync-note {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .sync-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .sync-input {
      width: 100%;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid rgba(99, 179, 237, 0.24);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      outline: 0;
    }

    .sync-button,
    .sync-link-button {
      min-height: 40px;
      border-radius: 14px;
      transition: transform 160ms ease, background 160ms ease;
    }

    .sync-button {
      padding: 0 14px;
      color: var(--white);
      background: linear-gradient(135deg, var(--sea), var(--sky));
      box-shadow: var(--glow);
      white-space: nowrap;
    }

    .sync-link-button {
      padding: 0 12px;
      color: var(--sea);
      background: rgba(234, 246, 255, 0.9);
      white-space: nowrap;
    }

    .sync-card > .sync-link-button {
      justify-self: end;
    }

    .sync-button:disabled,
    .sync-link-button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .sync-button:active,
    .sync-link-button:active {
      transform: scale(0.98);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 16px 0 10px;
    }

    .section-title span {
      color: var(--muted);
      font-size: 13px;
    }

    .today-grid {
      display: grid;
      gap: 12px;
    }

    .meal-card {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 12px;
      padding: 14px;
    }

    .meal-copy,
    .detail-copy {
      min-width: 0;
    }

    .meal-top,
    .detail-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .meal-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #EAF6FF;
      color: var(--sea);
      font-size: 21px;
    }

    .meal-card p {
      margin-top: 6px;
      white-space: pre-wrap;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.55;
    }

    .meal-meta,
    .tiny-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .delete-record-button {
      min-width: 44px;
      min-height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      color: #9B4D46;
      background: rgba(255, 238, 232, 0.9);
      font-size: 12px;
      flex: 0 0 auto;
      transition: transform 160ms ease, background 160ms ease;
    }

    .delete-record-button:active {
      transform: scale(0.96);
      background: rgba(255, 220, 210, 0.96);
    }

    .empty-state {
      padding: 22px 18px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(99, 179, 237, 0.45);
      background: rgba(255, 255, 255, 0.6);
      border-radius: var(--radius);
    }

    .empty-state .drop {
      display: block;
      margin-bottom: 8px;
      font-size: 26px;
      animation: drip 2.2s ease-in-out infinite;
    }

    .mood-card {
      padding: 14px;
    }

    .mood-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .mood-header .selected-mood {
      color: var(--sea);
      font-size: 13px;
      white-space: nowrap;
    }

    .mood-options {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .mood-button {
      min-height: 64px;
      padding: 8px 4px;
      border-radius: 14px;
      background: rgba(234, 246, 255, 0.82);
      color: var(--ink);
      display: grid;
      gap: 4px;
      place-items: center;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .mood-button b {
      font-size: 22px;
      line-height: 1;
    }

    .mood-button span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.15;
      word-break: keep-all;
    }

    .mood-button.active {
      background: #FFFFFF;
      box-shadow: inset 0 0 0 2px rgba(43, 108, 176, 0.34), var(--glow);
      transform: translateY(-2px);
    }

    .bowel-card {
      padding: 14px;
    }

    .bowel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .bowel-header .selected-bowel {
      color: var(--sea);
      font-size: 13px;
      white-space: nowrap;
    }

    .bowel-options {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      align-items: center;
    }

    .bowel-button {
      min-height: 66px;
      padding: 0;
      border-radius: 0;
      background: transparent;
      display: grid;
      place-items: center;
      box-shadow: none;
      transition: transform 180ms ease, filter 180ms ease;
    }

    .bowel-button img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 13px;
      filter: drop-shadow(0 8px 14px rgba(78, 104, 132, 0.14));
      transition: transform 180ms ease, filter 180ms ease;
    }

    .bowel-button.active {
      background: transparent;
      box-shadow: none;
      transform: translateY(-2px);
    }

    .bowel-button.active img {
      filter: drop-shadow(0 9px 16px rgba(43, 108, 176, 0.25));
      transform: scale(1.03);
    }

    .bowel-history {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .bowel-record {
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(99, 179, 237, 0.16);
    }

    .bowel-record-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      overflow: hidden;
      background: #FFFFFF;
      display: grid;
      place-items: center;
    }

    .bowel-record-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bowel-record p {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .calendar-panel {
      padding: 14px;
    }

    .calendar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .icon-button {
      position: relative;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      color: var(--sea);
      background: rgba(234, 246, 255, 0.94);
      display: grid;
      place-items: center;
      box-shadow: none;
      overflow: hidden;
    }

    .icon-button:active,
    .primary-action:active,
    .range-chip:active,
    .mood-button:active,
    .meal-option:active {
      transform: scale(0.98);
    }

    .week-row,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .week-row {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .day-cell {
      position: relative;
      min-height: 48px;
      border-radius: 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.56);
      display: grid;
      place-items: center;
      gap: 0;
      padding: 6px 2px 4px;
    }

    .day-cell.other-month {
      color: rgba(113, 128, 150, 0.42);
    }

    .day-cell.today {
      box-shadow: inset 0 0 0 2px rgba(43, 108, 176, 0.32);
    }

    .day-cell.selected {
      background: rgba(99, 179, 237, 0.18);
    }

    .day-cell .date-number {
      font-size: 14px;
      font-weight: 700;
    }

    .day-markers {
      min-height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1px;
      font-size: 13px;
    }

    .day-cell.has-record:hover .day-markers,
    .day-cell.has-record:focus-visible .day-markers {
      animation: wiggleDrop 420ms ease;
    }

    .selected-day-detail {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(99, 179, 237, 0.18);
    }

    .detail-list {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .detail-item {
      padding: 11px 12px;
      border-radius: 13px;
      background: rgba(234, 246, 255, 0.64);
    }

    .detail-item p {
      margin-top: 4px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .export-panel {
      padding: 16px;
    }

    .range-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0;
    }

    .range-chip,
    .meal-option {
      min-height: 44px;
      border-radius: 14px;
      color: var(--sea);
      background: rgba(234, 246, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .range-chip.active,
    .meal-option.active {
      color: var(--white);
      background: linear-gradient(135deg, var(--sea), var(--sky));
      box-shadow: var(--glow);
    }

    .date-inputs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    label.input-label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    input[type="date"],
    textarea {
      width: 100%;
      border: 1px solid rgba(99, 179, 237, 0.24);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      outline: 0;
    }

    input[type="date"] {
      min-height: 44px;
      padding: 0 10px;
    }

    textarea {
      min-height: 132px;
      padding: 13px 14px;
      line-height: 1.55;
      resize: vertical;
    }

    textarea::placeholder {
      color: rgba(113, 128, 150, 0.64);
    }

    .preview-box {
      padding: 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.66);
      border: 1px solid rgba(99, 179, 237, 0.16);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .primary-action {
      position: relative;
      min-height: 48px;
      width: 100%;
      border-radius: 999px;
      color: white;
      background: linear-gradient(135deg, var(--sea), var(--sky));
      box-shadow: var(--strong-glow);
      font-weight: 750;
      overflow: hidden;
      transition: transform 160ms ease;
    }

    .primary-action.secondary {
      color: var(--sea);
      background: rgba(234, 246, 255, 0.92);
      box-shadow: none;
    }

    .primary-action[disabled] {
      cursor: not-allowed;
      opacity: 0.52;
      box-shadow: none;
    }

    .ripple-target::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      opacity: 0;
      transform: translate(-50%, -50%) scale(1);
    }

    .ripple-target:active::after {
      animation: tapRipple 520ms ease-out;
    }

    .fab {
      position: fixed;
      left: 50%;
      bottom: calc(76px + env(safe-area-inset-bottom));
      z-index: 6;
      width: min(180px, calc(100vw - 42px));
      min-height: 54px;
      transform: translateX(-50%);
      border-radius: 999px;
      color: white;
      background: linear-gradient(135deg, var(--sea), var(--sky));
      box-shadow: 0 16px 34px rgba(43, 108, 176, 0.24);
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow: hidden;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 7;
      width: min(100% - 24px, 496px);
      transform: translateX(-50%);
      min-height: 62px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 14px 36px rgba(43, 108, 176, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(18px);
    }

    .nav-button {
      border-radius: 16px;
      color: var(--muted);
      background: transparent;
      display: grid;
      gap: 2px;
      place-items: center;
      font-size: 12px;
      line-height: 1.2;
    }

    .nav-button b {
      font-size: 20px;
      line-height: 1;
      font-weight: 500;
    }

    .nav-button.active {
      color: var(--sea);
      background: rgba(234, 246, 255, 0.92);
    }

    .sheet-backdrop,
    .encourage-backdrop,
    .milestone-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      background: rgba(45, 55, 72, 0.18);
      backdrop-filter: blur(8px);
    }

    .sheet-backdrop.open,
    .encourage-backdrop.open,
    .milestone-backdrop.open {
      display: block;
      animation: fadeIn 180ms ease-out both;
    }

    .sheet {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: min(100%, 520px);
      transform: translateX(-50%);
      padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
      border-radius: 26px 26px 0 0;
      background:
        radial-gradient(circle at 20% 0%, rgba(99, 179, 237, 0.16), transparent 26%),
        var(--white);
      box-shadow: 0 -20px 48px rgba(43, 108, 176, 0.17);
      animation: sheetIn 260ms ease-out both;
    }

    .sheet-handle {
      width: 46px;
      height: 5px;
      border-radius: 999px;
      background: rgba(99, 179, 237, 0.42);
      margin: 0 auto 14px;
    }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 12px;
    }

    .meal-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 10px 0 14px;
    }

    .meal-option {
      min-height: 62px;
      flex-direction: column;
      gap: 2px;
      font-size: 13px;
    }

    .meal-option b {
      font-size: 20px;
      line-height: 1;
    }

    .sheet-actions {
      display: grid;
      grid-template-columns: 0.82fr 1.18fr;
      gap: 10px;
      margin-top: 12px;
    }

    .encourage-card {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: min(100%, 520px);
      min-height: 46vh;
      transform: translateX(-50%);
      padding: 28px 24px calc(24px + env(safe-area-inset-bottom));
      border-radius: 32px 32px 0 0;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 -26px 62px rgba(43, 108, 176, 0.2);
      overflow: hidden;
      display: grid;
      place-items: center;
      text-align: center;
      animation: sheetIn 260ms ease-out both;
    }

    .encourage-card::before,
    .encourage-card::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 48%;
      width: 110px;
      height: 110px;

    function loadState() {
      const fallback = {
        records: [],
        bowelRecords: [],
        dailyMood: {},
        milestonesShown: {},
        deletedRecords: {},
        deletedBowelRecords: {},
        lastSyncedAt: ""
      };

      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return {
          records: Array.isArray(parsed.records) ? parsed.records : [],
          bowelRecords: Array.isArray(parsed.bowelRecords) ? parsed.bowelRecords : [],
          dailyMood: parsed.dailyMood && typeof parsed.dailyMood === "object" ? parsed.dailyMood : {},
          milestonesShown: parsed.milestonesShown && typeof parsed.milestonesShown === "object" ? parsed.milestonesShown : {},
          deletedRecords: parsed.deletedRecords && typeof parsed.deletedRecords === "object" ? parsed.deletedRecords : {},
          deletedBowelRecords: parsed.deletedBowelRecords && typeof parsed.deletedBowelRecords === "object" ? parsed.deletedBowelRecords : {},
          lastSyncedAt: parsed.lastSyncedAt || ""
        };
      } catch (error) {
        return fallback;
      }
    }

    function loadAuthSession() {
      const savedSession = readStoredAuthSession();
      if (savedSession) return savedSession;

      const cookieSession = readCookieAuthSession();
      if (cookieSession) {
        try {
          localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(cookieSession));
        } catch (error) {}
        return cookieSession;
      }

      return null;
    }

    function readStoredAuthSession() {
      try {
        const raw = localStorage.getItem(AUTH_STORAGE_KEY);
        if (!raw) return null;
        return normalizeAuthSession(JSON.parse(raw));
      } catch (error) {
        return null;
      }
    }

    function readCookieAuthSession() {
      try {
        const raw = readCookie(AUTH_COOKIE_NAME);
        if (!raw) return null;
        return normalizeAuthSession(JSON.parse(raw));
      } catch (error) {
        return null;
      }
    }

    function normalizeAuthSession(session) {
      if (!session || !session.accessToken || !session.refreshToken) return null;
      const user = session.user && session.user.id
        ? { id: session.user.id, email: session.user.email || "" }
        : null;

      return {
        accessToken: session.accessToken,
        refreshToken: session.refreshToken,
        expiresAt: Number(session.expiresAt) || 0,
        user
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function saveAuthSession() {
      const savedSession = normalizeAuthSession(authSession);
      authSession = savedSession;
      if (savedSession) {
        const serialized = JSON.stringify(savedSession);
        localStorage.setItem(AUTH_STORAGE_KEY, serialized);
        writeCookie(AUTH_COOKIE_NAME, serialized, AUTH_COOKIE_MAX_AGE);
      } else {
        localStorage.removeItem(AUTH_STORAGE_KEY);
        clearCookie(AUTH_COOKIE_NAME);
      }
    }

        "day-cell",
        cell.currentMonth ? "" : "other-month",

    function bindPageEvents() {
      app.querySelectorAll("[data-action]").forEach((node) => {
        const action = node.dataset.action;
        if (action === "switch-tab") {
          node.addEventListener("click", () => {
            activeTab = node.dataset.tab;
            render();
          });
        }
        if (action === "open-record") node.addEventListener("click", openRecordSheet);
        if (action === "toggle-sync-panel") {
          node.addEventListener("click", () => {
            syncPanelOpen = !syncPanelOpen;
            render();
          });
        }
        if (action === "close-sync-panel") {
          node.addEventListener("click", () => {
            syncPanelOpen = false;
            render();
          });
        }
        if (action === "login-email") {
          node.addEventListener("input", () => {
            loginEmailDraft = node.value.trim();
            localStorage.setItem("dida-ji-login-email", loginEmailDraft);
          });
          node.addEventListener("keydown", (event) => {
            if (event.key === "Enter") sendLoginLink();
          });
        }
        if (action === "login-code") {
          node.addEventListener("input", () => {
            loginCodeDraft = normalizeOtpCode(node.value);
            node.value = loginCodeDraft;
          });
          node.addEventListener("keydown", (event) => {
            if (event.key === "Enter") verifyLoginCode();
          });
        }
        if (action === "send-login-link") node.addEventListener("click", sendLoginLink);
        if (action === "verify-login-code") node.addEventListener("click", verifyLoginCode);
        if (action === "sync-now") node.addEventListener("click", () => syncNow(true));
        if (action === "sign-out") node.addEventListener("click", signOut);
        if (action === "set-mood") {
          node.addEventListener("click", () => {
            state.dailyMood[getTodayKey()] = {
              emoji: node.dataset.emoji,
              label: node.dataset.label,
              updatedAt: new Date().toISOString()
            };
            saveState();
            showToast(`今日感受已记录：${node.dataset.emoji} ${node.dataset.label}`);
            render();
            queueSync();
          });
        }
        if (action === "add-bowel-record") {
          node.addEventListener("click", () => addBowelRecord(node.dataset.type));
        }
        if (action === "prev-month") {
          node.addEventListener("click", () => {
            calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() - 1, 1);
            selectedDate = toDateKey(calendarCursor);
            render();
          });
        }
        if (action === "next-month") {
          node.addEventListener("click", () => {
            calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() + 1, 1);
            selectedDate = toDateKey(calendarCursor);
            render();
          });
        }
        if (action === "select-date") {
          node.addEventListener("click", () => {
            selectedDate = node.dataset.date;
            render();
          });
        }
        if (action === "set-export-mode") {
          node.addEventListener("click", () => {
            exportMode = node.dataset.mode;
            render();
          });
        }
        if (action === "custom-start") {
          node.addEventListener("change", () => {
            customRange.start = node.value || customRange.start;
            if (customRange.start > customRange.end) customRange.end = customRange.start;
            render();
          });
        }
        if (action === "custom-end") {
          node.addEventListener("change", () => {
            customRange.end = node.value || customRange.end;
            if (customRange.end < customRange.start) customRange.start = customRange.end;
            render();
          });
        }
        if (action === "download-md") node.addEventListener("click", downloadMarkdown);
        if (action === "delete-record") {
          node.addEventListener("click", () => deleteRecord(node.dataset.id));
        }
        if (action === "delete-bowel-record") {
          node.addEventListener("click", () => deleteBowelRecord(node.dataset.id));
        }
      });
    }

    function renderMealOptions() {
      mealOptionsNode.innerHTML = mealOptions.map((meal) => `
        <button class="meal-option ${selectedMeal === meal.name ? "active" : ""}" type="button" data-meal="${meal.name}">
          <b>${meal.icon}</b>
          <span>${meal.name}</span>

      mealOptionsNode.querySelectorAll("button").forEach((button) => {

    function openRecordSheet() {
      document.getElementById("recordDateText").textContent = formatDateHuman(getTodayKey());
      foodContent.value = "";
      selectedMeal = inferNextMeal();
      renderMealOptions();
      recordSheet.classList.add("open");
      recordSheet.setAttribute("aria-hidden", "false");
      window.setTimeout(() => foodContent.focus(), 120);
    }

    function closeRecordSheet() {
      recordSheet.classList.remove("open");
      recordSheet.setAttribute("aria-hidden", "true");
    }

    function saveRecord() {
      const content = foodContent.value.trim();
      if (!content) {
        showToast("先写一点食物内容就可以保存啦");
        return;
      }

      const record = {
        id: createUuid(),
        date: getTodayKey(),
        meal: selectedMeal,
        content,
        createdAt: new Date().toISOString()
      };

      state.records.push(record);
      saveState();
      closeRecordSheet();
      render();
      showEncouragement(content);
      queueSync();
      window.setTimeout(() => checkAndShowMilestone(), 620);
    }

    function deleteRecord(recordId) {
      const record = state.records.find((item) => item.id === recordId);
      if (!record) return;

      const ok = window.confirm(`确定删除这条${record.meal}记录吗？`);
      if (!ok) return;

      state.deletedRecords = state.deletedRecords || {};
      state.deletedRecords[recordId] = new Date().toISOString();
      state.records = state.records.filter((item) => item.id !== recordId);
      saveState();
      showToast("这条记录已删除");
      render();
      queueSync();
    }

    function addBowelRecord(typeKey) {
      const option = getBowelOption(typeKey);
      const record = {
        id: createUuid(),
        date: getTodayKey(),
        typeKey: option.key,
        bristolRange: option.bristolRange,
        label: option.label,
        createdAt: new Date().toISOString()
      };

      state.bowelRecords = Array.isArray(state.bowelRecords) ? state.bowelRecords : [];
      state.bowelRecords.push(record);
      saveState();
      render();
      showBowelEncouragement(option);
      queueSync();
      queueBowelMilestone();
    }

    function deleteBowelRecord(recordId) {
      const record = (Array.isArray(state.bowelRecords) ? state.bowelRecords : []).find((item) => item.id === recordId);
      if (!record) return;

      const ok = window.confirm("确定删除这条大便情况记录吗？");
      if (!ok) return;

      state.deletedBowelRecords = state.deletedBowelRecords || {};
      state.deletedBowelRecords[recordId] = new Date().toISOString();
      state.bowelRecords = state.bowelRecords.filter((item) => item.id !== recordId);
      saveState();
      showToast("这条大便情况已删除");
      render();
      queueSync();
    }

    function captureAuthRedirect() {
      const hash = window.location.hash && window.location.hash.startsWith("#")
        ? window.location.hash.slice(1)
        : "";
      if (!hash) return;

      const params = new URLSearchParams(hash);
      const errorDescription = params.get("error_description");
      if (errorDescription) {
        showToast(decodeURIComponent(errorDescription));
        window.history.replaceState(null, "", window.location.pathname + window.location.search);
        return;
      }

      const accessToken = params.get("access_token");
      const refreshToken = params.get("refresh_token");
      if (!accessToken || !refreshToken) return;

      const expiresAt = Number(params.get("expires_at")) || Math.floor(Date.now() / 1000) + Number(params.get("expires_in") || 3600);
      authSession = {
        accessToken,
        refreshToken,
        expiresAt,
        user: currentUser || null
      };
      saveAuthSession();
      syncStatus = "登录成功，准备同步...";
      window.history.replaceState(null, "", window.location.pathname + window.location.search);
    }

    async function sendLoginLink() {
      const emailInput = app.querySelector('[data-action="login-email"]');
      const email = (emailInput ? emailInput.value : loginEmailDraft).trim();
      if (!email || !email.includes("@")) {
        showToast("先输入一个邮箱地址");
        return;
      }

      loginEmailDraft = email;
      localStorage.setItem("dida-ji-login-email", email);
      syncBusy = true;
      syncStatus = "正在发送登录邮件...";
      render();

      try {
        const redirectUrl = window.location.origin + window.location.pathname;
        await supabaseRequest(`/auth/v1/otp?redirect_to=${encodeURIComponent(redirectUrl)}`, {
          method: "POST",
          body: JSON.stringify({
            email,
            create_user: true
          })
        }, false);
        showToast("邮件已发送，把验证码填回这里");
        syncStatus = "邮件已发送，等待验证码";
      } catch (error) {
        console.warn(error);
        syncStatus = "登录邮件发送失败";
        showToast("发送失败，稍后再试");
      } finally {
        syncBusy = false;
        render();
      }
    }

    async function verifyLoginCode() {
      const emailInput = app.querySelector('[data-action="login-email"]');
      const codeInput = app.querySelector('[data-action="login-code"]');
      const email = (emailInput ? emailInput.value : loginEmailDraft).trim();
      const token = normalizeOtpCode(codeInput ? codeInput.value : loginCodeDraft);

      if (!email || !email.includes("@")) {
        showToast("先输入邮箱地址");
        return;
      }
      if (!token) {
        showToast("请输入邮件里的验证码");
        return;
      }

      loginEmailDraft = email;
      loginCodeDraft = token;
      localStorage.setItem("dida-ji-login-email", email);
      syncBusy = true;
      syncStatus = "正在验证邮箱...";
      render();

      try {
        const data = await supabaseRequest("/auth/v1/verify", {
          method: "POST",
          body: JSON.stringify({
            email,
            token,
            type: "email"
          })
        }, false);

        applyAuthResponse(data);
        loginCodeDraft = "";
        syncStatus = "登录成功，准备同步...";
        showToast("桌面入口已登录");
        syncBusy = false;
        render();
        await syncNow(false);
      } catch (error) {
        console.warn(error);
        syncStatus = "验证码登录失败";
        showToast("验证码不正确或已过期");
        syncBusy = false;
        render();
      }
    }

    async function signOut() {
      syncBusy = true;
      syncStatus = "正在退出...";
      render();
      try {
        if (authSession) {
          await supabaseRequest("/auth/v1/logout", { method: "POST" }, true);
        }
      } catch (error) {
        console.warn(error);
      } finally {
        authSession = null;
        currentUser = null;
        syncStatus = "未登录";
        syncBusy = false;
        saveAuthSession();
        showToast("已退出云同步");
        render();
      }
    }

    function queueSync() {
      if (!authSession) return;
      syncPending = true;
      syncStatus = "等待同步...";
      window.clearTimeout(syncTimer);
      syncTimer = window.setTimeout(() => syncNow(false), 420);
    }

    async function syncNow(manual) {
      if (syncBusy) {
        syncPending = true;
        return;
      }
      if (!authSession) {
        if (manual) showToast("先登录，再开启云同步");
        return;
      }

      syncPending = false;
      syncBusy = true;
      syncStatus = "同步中...";
      render();

      try {
        const user = await ensureSessionUser();
        normalizeState();

        const [cloudRecords, cloudMoods, cloudBowelRecords] = await Promise.all([
          fetchCloudRecords(),
          fetchCloudMoods(),
          fetchCloudBowelRecords()
        ]);

        const deletedRows = cloudRecords.filter((row) => row.deleted_at);
        const cloudDeletedIds = new Set(deletedRows.map((row) => row.id));
        state.deletedRecords = state.deletedRecords || {};
        deletedRows.forEach((row) => {
          state.deletedRecords[row.id] = row.deleted_at;
        });
        state.records = state.records.filter((record) => !cloudDeletedIds.has(record.id) && !state.deletedRecords[record.id]);

        const recordsToUpload = state.records.map((record) => localRecordToCloud(record, user.id));
        if (recordsToUpload.length) await upsertCloudRows("records", recordsToUpload, "id");

        const localDeleted = Object.keys(state.deletedRecords || {});
        if (localDeleted.length) {
          await Promise.all(localDeleted.map((recordId) => markCloudRecordDeleted(recordId, state.deletedRecords[recordId])));
        }

        const moodsToUpload = buildMoodsToUpload(user.id, cloudMoods);
        if (moodsToUpload.length) await upsertCloudRows("daily_moods", moodsToUpload, "user_id,mood_date");

        if (bowelCloudAvailable) {
          const deletedBowelRows = cloudBowelRecords.filter((row) => row.deleted_at);
          const cloudDeletedBowelIds = new Set(deletedBowelRows.map((row) => row.id));
          state.deletedBowelRecords = state.deletedBowelRecords || {};
          deletedBowelRows.forEach((row) => {
            state.deletedBowelRecords[row.id] = row.deleted_at;
          });
          state.bowelRecords = state.bowelRecords.filter((record) => !cloudDeletedBowelIds.has(record.id) && !state.deletedBowelRecords[record.id]);

          const bowelRecordsToUpload = state.bowelRecords.map((record) => localBowelRecordToCloud(record, user.id));
          if (bowelRecordsToUpload.length) await upsertCloudRows("bowel_records", bowelRecordsToUpload, "id");

          const localDeletedBowel = Object.keys(state.deletedBowelRecords || {});
          if (localDeletedBowel.length) {
            await Promise.all(localDeletedBowel.map((recordId) => markCloudBowelRecordDeleted(recordId, state.deletedBowelRecords[recordId])));
          }
        }

        const [latestRecords, latestMoods, latestBowelRecords] = await Promise.all([
          fetchCloudRecords(),
          fetchCloudMoods(),
          bowelCloudAvailable ? fetchCloudBowelRecords() : Promise.resolve([])
        ]);

        applyCloudRecords(latestRecords);
        applyCloudMoods(latestMoods);
        if (bowelCloudAvailable) applyCloudBowelRecords(latestBowelRecords);
        state.lastSyncedAt = new Date().toISOString();
        saveState();
        syncStatus = bowelCloudAvailable
          ? `已同步 ${new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })}`
          : "饮食已同步，大便情况待建表";
        if (manual) showToast(bowelCloudAvailable ? "云同步完成" : "基础同步完成，大便情况先保存在本机");
      } catch (error) {
        console.warn(error);
        syncStatus = "同步失败，可继续本地记录";
        if (manual) showToast("同步失败，记录仍保存在本机");
      } finally {
        syncBusy = false;
        render();
        if (syncPending && authSession) {
          window.clearTimeout(syncTimer);
          syncTimer = window.setTimeout(() => syncNow(false), 420);
        }
      }
    }

    async function ensureSessionUser() {
      if (!authSession) throw new Error("Not signed in");
      const now = Math.floor(Date.now() / 1000);
      if (!authSession.expiresAt || authSession.expiresAt - now < 90) {
        await refreshAuthSession();
      }

      const user = await supabaseRequest("/auth/v1/user", { method: "GET" }, true);
      currentUser = user && user.user ? user.user : user;
      if (!currentUser || !currentUser.id) throw new Error("Cannot load user");
      authSession.user = currentUser;
      saveAuthSession();
      return currentUser;
    }

    async function refreshAuthSession() {
      const data = await supabaseRequest("/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        body: JSON.stringify({
          refresh_token: authSession.refreshToken
        })
      }, false);

      authSession = {
        accessToken: data.access_token,
        refreshToken: data.refresh_token || authSession.refreshToken,
        expiresAt: Math.floor(Date.now() / 1000) + Number(data.expires_in || 3600),
        user: data.user || currentUser
      };
      currentUser = authSession.user || currentUser;
      saveAuthSession();
    }

    function applyAuthResponse(data) {
      const session = data && data.session ? data.session : data;
      if (!session || !session.access_token || !session.refresh_token) {
        throw new Error("Cannot create auth session");
      }

      authSession = {
        accessToken: session.access_token,
        refreshToken: session.refresh_token,
        expiresAt: Number(session.expires_at) || Math.floor(Date.now() / 1000) + Number(session.expires_in || 3600),
        user: session.user || data.user || currentUser || null
      };
      currentUser = authSession.user || currentUser;
      saveAuthSession();
    }

    async function supabaseRequest(path, options, includeAuth) {
      const headers = Object.assign({
        apikey: SUPABASE_PUBLISHABLE_KEY
      }, options && options.headers ? options.headers : {});

      if (includeAuth && authSession && authSession.accessToken) {
        headers.Authorization = `Bearer ${authSession.accessToken}`;
      }
      if (options && options.body && !headers["Content-Type"]) {
        headers["Content-Type"] = "application/json";
      }

      const response = await fetch(`${SUPABASE_URL}${path}`, Object.assign({}, options, { headers }));
      const text = await response.text();
      if (!response.ok) {
        let message = text || response.statusText;
        try {
          const parsed = JSON.parse(text);
          message = parsed.msg || parsed.message || parsed.error_description || message;
        } catch (error) {}
        throw new Error(message);
      }
      if (!text) return null;
      try {
        return JSON.parse(text);
      } catch (error) {
        return text;
      }
    }

    async function fetchCloudRecords() {
      return await supabaseRequest("/rest/v1/records?select=*&order=record_date.asc,created_at.asc", {
        method: "GET"
      }, true) || [];
    }

    async function fetchCloudMoods() {
      return await supabaseRequest("/rest/v1/daily_moods?select=*&order=mood_date.asc", {
        method: "GET"
      }, true) || [];
    }

    async function fetchCloudBowelRecords() {
      try {
        const rows = await supabaseRequest("/rest/v1/bowel_records?select=*&order=record_date.asc,client_created_at.asc", {
          method: "GET"
        }, true);
        bowelCloudAvailable = true;
        return rows || [];
      } catch (error) {
        if (isMissingBowelTableError(error)) {
          bowelCloudAvailable = false;
          console.warn(error);
          return [];
        }
        throw error;
      }
    }

    async function upsertCloudRows(table, rows, conflictTarget) {
      return await supabaseRequest(`/rest/v1/${table}?on_conflict=${encodeURIComponent(conflictTarget)}`, {
        method: "POST",
        headers: {
          Prefer: "resolution=merge-duplicates,return=minimal"
        },
        body: JSON.stringify(rows)
      }, true);
    }

    async function markCloudRecordDeleted(recordId, deletedAt) {
      if (!isUuid(recordId)) return;
      return await supabaseRequest(`/rest/v1/records?id=eq.${encodeURIComponent(recordId)}`, {
        method: "PATCH",
        headers: {
          Prefer: "return=minimal"
        },
        body: JSON.stringify({
          deleted_at: deletedAt || new Date().toISOString()
        })
      }, true);
    }

    async function markCloudBowelRecordDeleted(recordId, deletedAt) {
      if (!isUuid(recordId) || !bowelCloudAvailable) return;
      return await supabaseRequest(`/rest/v1/bowel_records?id=eq.${encodeURIComponent(recordId)}`, {
        method: "PATCH",
        headers: {
          Prefer: "return=minimal"
        },
        body: JSON.stringify({
          deleted_at: deletedAt || new Date().toISOString()
        })
      }, true);
    }

    function buildMoodsToUpload(userId, cloudMoods) {
      const cloudByDate = new Map(cloudMoods.map((row) => [row.mood_date, row]));
      return Object.entries(state.dailyMood || {}).reduce((rows, [date, mood]) => {
        if (!mood || !mood.emoji) return rows;
        const cloudMood = cloudByDate.get(date);
        const localTime = Date.parse(mood.updatedAt || "") || 0;
        const cloudTime = cloudMood ? Date.parse(cloudMood.updated_at || "") || 0 : 0;
        if (cloudMood && cloudTime > localTime) return rows;
        rows.push({
          user_id: userId,
          mood_date: date,
          mood_emoji: mood.emoji,
          mood_label: mood.label || getMoodLabel(mood.emoji)
        });
        return rows;
      }, []);
    }

    function applyCloudRecords(rows) {
      const deleted = {};
      const records = rows.reduce((items, row) => {
        if (row.deleted_at) {
          deleted[row.id] = row.deleted_at;
          return items;
        }
        items.push({
          id: row.id,
          date: row.record_date,
          meal: row.meal,
          content: row.content,
          createdAt: row.client_created_at || row.created_at,
          syncedAt: row.updated_at
        });
        return items;
      }, []);

      state.deletedRecords = Object.assign({}, state.deletedRecords || {}, deleted);
      state.records = records.sort((a, b) => a.date.localeCompare(b.date) || String(a.createdAt || "").localeCompare(String(b.createdAt || "")));
    }

    function applyCloudMoods(rows) {
      const moods = {};
      rows.forEach((row) => {
        moods[row.mood_date] = {
          emoji: row.mood_emoji,
          label: row.mood_label,
          updatedAt: row.updated_at
        };
      });
      state.dailyMood = moods;
    }

    function applyCloudBowelRecords(rows) {
      const deleted = {};
      const records = rows.reduce((items, row) => {
        if (row.deleted_at) {
          deleted[row.id] = row.deleted_at;
          return items;
        }
        const option = getBowelOption(row.type_key);
        items.push({
          id: row.id,
          date: row.record_date,
          typeKey: option.key,
          bristolRange: row.bristol_range || option.bristolRange,
          label: row.label || option.label,
          createdAt: row.client_created_at || row.created_at,
          syncedAt: row.updated_at
        });
        return items;
      }, []);

      state.deletedBowelRecords = Object.assign({}, state.deletedBowelRecords || {}, deleted);
      state.bowelRecords = records.sort((a, b) => a.date.localeCompare(b.date) || String(a.createdAt || "").localeCompare(String(b.createdAt || "")));
    }

    function localRecordToCloud(record, userId) {
      return {
        id: record.id,
        user_id: userId,
        record_date: record.date,
        meal: record.meal,
        content: record.content,
        client_created_at: record.createdAt || new Date().toISOString(),
        deleted_at: null
      };
    }

    function localBowelRecordToCloud(record, userId) {
      const option = getBowelOption(record.typeKey);
      return {
        id: record.id,
        user_id: userId,
        record_date: record.date,
        type_key: option.key,
        bristol_range: option.bristolRange,
        label: option.label,
        client_created_at: record.createdAt || new Date().toISOString(),
        deleted_at: null
      };
    }

    function isMissingBowelTableError(error) {
      const message = String(error && error.message ? error.message : error || "").toLowerCase();
      return message.includes("bowel_records") && (
        message.includes("does not exist") ||
        message.includes("could not find") ||
        message.includes("not found")
      );
    }

    function normalizeState() {
      let changed = false;
      state.deletedRecords = state.deletedRecords && typeof state.deletedRecords === "object" ? state.deletedRecords : {};
      state.deletedBowelRecords = state.deletedBowelRecords && typeof state.deletedBowelRecords === "object" ? state.deletedBowelRecords : {};
      state.milestonesShown = state.milestonesShown && typeof state.milestonesShown === "object" ? state.milestonesShown : {};
      state.dailyMood = state.dailyMood && typeof state.dailyMood === "object" ? state.dailyMood : {};

      state.records = (Array.isArray(state.records) ? state.records : []).filter((record) => {
        return record && record.date && record.meal && record.content && !state.deletedRecords[record.id];
      }).map((record) => {
        const next = Object.assign({}, record);
        if (!isUuid(next.id)) {
          next.id = createUuid();
          changed = true;
        }
        if (!next.createdAt) {
          next.createdAt = new Date().toISOString();
          changed = true;
        }
        return next;
      });

      state.bowelRecords = (Array.isArray(state.bowelRecords) ? state.bowelRecords : []).filter((record) => {
        return record && record.date && record.typeKey && !state.deletedBowelRecords[record.id];
      }).map((record) => {
        const next = Object.assign({}, record);
        const option = bowelOptions.find((item) => item.key === next.typeKey) || bowelOptions[2];
        if (!isUuid(next.id)) {
          next.id = createUuid();
          changed = true;
        }
        if (next.typeKey !== option.key) {
          next.typeKey = option.key;
          changed = true;
        }
        if (next.bristolRange !== option.bristolRange) {
          next.bristolRange = option.bristolRange;
          changed = true;
        }
        if (next.label !== option.label) {
          next.label = option.label;
          changed = true;
        }
        if (!next.createdAt) {
          next.createdAt = new Date().toISOString();
          changed = true;
        }
        return next;
      });

      Object.keys(state.dailyMood).forEach((date) => {
        const mood = state.dailyMood[date];
        if (typeof mood === "string") {
          state.dailyMood[date] = {
            emoji: mood,
            label: getMoodLabel(mood),
            updatedAt: ""
          };
          changed = true;
        } else if (mood && mood.emoji && !mood.label) {
          mood.label = getMoodLabel(mood.emoji);
          changed = true;
        }
      });

      if (changed) saveState();
    }

    function getMoodLabel(emoji) {
      const mood = moodOptions.find((item) => item.emoji === emoji);
      return mood ? mood.label : "已记录";
    }

    function isUuid(value) {
      return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value || ""));
    }

    function createUuid() {
      if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
      const bytes = new Uint8Array(16);
      if (window.crypto && window.crypto.getRandomValues) {
        window.crypto.getRandomValues(bytes);
      } else {
        for (let index = 0; index < bytes.length; index += 1) {
          bytes[index] = Math.floor(Math.random() * 256);
        }
      }
      bytes[6] = (bytes[6] & 0x0f) | 0x40;
      bytes[8] = (bytes[8] & 0x3f) | 0x80;
      const hex = Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0"));
      return `${hex.slice(0, 4).join("")}-${hex.slice(4, 6).join("")}-${hex.slice(6, 8).join("")}-${hex.slice(8, 10).join("")}-${hex.slice(10, 16).join("")}`;
    }

    function showEncouragement(content) {
      const cleanFood = summarizeFood(content);
      const index = Math.abs(hashString(content)) % encouragementTemplates.length;
      showEncouragementMessage(encouragementTemplates[index].split("{food}").join(cleanFood), "drop");
    }

    function showBowelEncouragement(option) {
      const count = (Array.isArray(state.bowelRecords) ? state.bowelRecords : []).length;
      const seed = `${option.key}-${count}`;
      const index = Math.abs(hashString(seed)) % bowelEncouragementTemplates.length;
      const message = bowelEncouragementTemplates[index].split("{label}").join(option.label);
      showEncouragementMessage(message, "bowel", option);
    }

    function showEncouragementMessage(message, kind, option) {
      const card = encourageModal.querySelector(".encourage-card");
      const icon = encourageModal.querySelector(".falling-drop");
      document.getElementById("encourageText").textContent = message;

      if (card) card.classList.toggle("bowel-encourage", kind === "bowel");
      if (icon) {
        icon.className = kind === "bowel" ? "falling-drop bowel-token" : "falling-drop";
        icon.innerHTML = kind === "bowel" && option
          ? `<img src="${option.icon}" alt="">`
          : "";
      }

      encourageModal.classList.add("open");
      encourageModal.setAttribute("aria-hidden", "false");
    }

    function closeEncouragement() {
      encourageModal.classList.remove("open");
      encourageModal.setAttribute("aria-hidden", "true");
      if (pendingBowelMilestone) {
        const milestone = pendingBowelMilestone;
        pendingBowelMilestone = null;
        window.setTimeout(() => showMilestone(milestone), 180);
      }
    }

    function getPendingMilestone() {
      const stats = getStats();
      const checks = [
        ["streak30", stats.streak >= 30],
        ["streak7", stats.streak >= 7],
        ["streak3", stats.streak >= 3],
        ["total100", stats.total >= 100]
      ];

      for (const [key, passed] of checks) {
        if (passed && !state.milestonesShown[key]) {
          return { key, ...milestones[key] };
        }
      }

      return null;
    }

    function getTodayMilestone(stats) {
      if (stats.streak >= 30) return milestones.streak30;
      if (stats.streak >= 7) return milestones.streak7;
      if (stats.streak >= 3) return milestones.streak3;
      return null;
    }

    function showPendingMilestone() {
      const pending = getPendingMilestone();
      if (pending) showMilestone(pending);
    }

    function checkAndShowMilestone() {
      const pending = getPendingMilestone();
      if (pending) showMilestone(pending);
    }

    function queueBowelMilestone() {
      const total = (Array.isArray(state.bowelRecords) ? state.bowelRecords : []).length;
      if (!total || total % 5 !== 0) return;

      const key = `bowel-${total}`;
      state.milestonesShown = state.milestonesShown && typeof state.milestonesShown === "object" ? state.milestonesShown : {};
      if (state.milestonesShown[key]) return;

      pendingBowelMilestone = {
        key,
        kind: "bowel-sparkle",
        icon: "✨",
        title: `第 ${total} 次身体线索`,
        message: "连续记录 5 次大便情况，小彩蛋解锁。身体的节奏正在变得更清楚。"
      };
    }

    function showMilestone(milestone) {
      state.milestonesShown[milestone.key] = true;
      saveState();

      milestoneModal.className = `milestone-backdrop open`;
      milestoneModal.setAttribute("aria-hidden", "false");
      milestoneModal.innerHTML = `
        <section class="milestone-scene ${milestone.kind}" role="dialog" aria-modal="true">
          ${milestone.kind === "milestone-30" ? `<div class="swimmer" aria-hidden="true"></div>` : ""}
          ${milestone.kind === "milestone-100" ? `<div class="gold-rain" aria-hidden="true"></div>` : ""}
          <div class="milestone-copy">
            <span class="big">${milestone.icon}</span>
            <h2>${milestone.title}</h2>
            <p>${milestone.message}</p>
            <div style="height:14px;"></div>
            <button class="primary-action ripple-target" type="button" data-close-milestone>收下这滴能量</button>
          </div>
        </section>
      `;

      const closeButton = milestoneModal.querySelector("[data-close-milestone]");
      if (closeButton) closeButton.addEventListener("click", closeMilestone);
    }

    function closeMilestone() {
      milestoneModal.classList.remove("open");
      milestoneModal.setAttribute("aria-hidden", "true");
      milestoneModal.innerHTML = "";
      render();
    }

    function getStats() {
      const total = state.records.length;
      const recordDates = [...new Set(state.records.map((record) => record.date))].sort();
      let streak = 0;
      let cursor = getTodayKey();

      while (recordDates.includes(cursor)) {
        streak += 1;
        cursor = shiftDate(cursor, -1);
      }

      return { total, streak };
    }

    function inferNextMeal() {
      const hour = new Date().getHours();
      if (hour < 10) return "早餐";
      if (hour < 15) return "午餐";
      if (hour < 21) return "晚餐";
      return "加餐";
    }

    function getRecordsByDate(dateKey) {
      return state.records
        .filter((record) => record.date === dateKey)
        .sort((a, b) => String(a.createdAt || "").localeCompare(String(b.createdAt || "")));
    }

    function getRecordsInRange(start, end) {
      return state.records
        .filter((record) => record.date >= start && record.date <= end)
        .sort((a, b) => a.date.localeCompare(b.date) || String(a.createdAt || "").localeCompare(String(b.createdAt || "")));
    }

    function getBowelOption(typeKey) {
      return bowelOptions.find((option) => option.key === typeKey) || bowelOptions[2];
    }

    function getBowelOptionLabel(typeKey) {
      return getBowelOption(typeKey).label;
    }

    function getBowelRecordsByDate(dateKey) {
      return (Array.isArray(state.bowelRecords) ? state.bowelRecords : [])
        .filter((record) => record.date === dateKey)
        .sort((a, b) => String(a.createdAt || "").localeCompare(String(b.createdAt || "")));
    }

    function getBowelRecordsInRange(start, end) {
      return (Array.isArray(state.bowelRecords) ? state.bowelRecords : [])
        .filter((record) => record.date >= start && record.date <= end)
        .sort((a, b) => a.date.localeCompare(b.date) || String(a.createdAt || "").localeCompare(String(b.createdAt || "")));
    }

    function getExportRange() {
      if (exportMode === "30") {
        return { start: shiftDate(getTodayKey(), -29), end: getTodayKey() };
      }
      if (exportMode === "custom") {
        return {
          start: customRange.start <= customRange.end ? customRange.start : customRange.end,
          end: customRange.end >= customRange.start ? customRange.end : customRange.start
        };
      }
      return { start: shiftDate(getTodayKey(), -6), end: getTodayKey() };
    }

    function downloadMarkdown() {
      const range = getExportRange();
      const markdown = buildMarkdown(range.start, range.end);
      const blob = new Blob([markdown], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `滴答记-饮食与身体记录-${range.start}_至_${range.end}.md`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast("Markdown 已开始下载");
    }

    function buildMarkdown(start, end) {
      const lines = [
        "# 滴答记 · 饮食与身体记录",
        `导出时间：${getTodayKey()}`,
        `记录范围：${start} 至 ${end}`,
        "",
        "---",
        ""
      ];

      const dates = collectDateRange(start, end).reverse();
      dates.forEach((date) => {
        const records = getRecordsByDate(date);
        const bowelRecords = getBowelRecordsByDate(date);
        const mood = state.dailyMood[date];
        if (!records.length && !bowelRecords.length && !mood) return;

        lines.push(`## ${date}`, "");
        mealOptions.forEach((meal) => {
          const mealRecords = records.filter((record) => record.meal === meal.name);
          if (!mealRecords.length) return;
          lines.push(`**${meal.name}**`);
          lines.push(mealRecords.map((record) => record.content).join("\n\n"));
          lines.push("");
        });
        if (bowelRecords.length) {
          lines.push("**大便情况**");
          bowelRecords.forEach((record) => {
            const option = getBowelOption(record.typeKey);
            const timeText = record.createdAt ? new Date(record.createdAt).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }) : "已记录";
            lines.push(`- ${timeText}：${option.label}`);
          });
          lines.push("");
        }
        lines.push(`今日感受：${mood ? `${mood.emoji} ${mood.label}` : "未记录"}`, "", "---", "");
      });

      return lines.join("\n").trimEnd() + "\n";
    }

    function collectDateRange(start, end) {
      const dates = [];
      let cursor = start;
      while (cursor <= end) {
        dates.push(cursor);
        cursor = shiftDate(cursor, 1);
      }
      return dates;
    }

    function getCalendarCells(monthDate) {
      const first = startOfMonth(monthDate);
      const startDay = (first.getDay() + 6) % 7;
      const gridStart = new Date(first);
      gridStart.setDate(first.getDate() - startDay);
      const cells = [];

      for (let index = 0; index < 42; index += 1) {
        const date = new Date(gridStart);
        date.setDate(gridStart.getDate() + index);
        cells.push({
          date,
          currentMonth: date.getMonth() === first.getMonth()
        });
      }

      return cells;
    }

    function startOfMonth(date) {
      return new Date(date.getFullYear(), date.getMonth(), 1);
    }

    function toDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function shiftDate(dateKey, days) {
      const date = parseDateKey(dateKey);
      date.setDate(date.getDate() + days);
      return toDateKey(date);
    }

    function parseDateKey(dateKey) {
      const [year, month, day] = dateKey.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function formatDateHuman(dateKey) {
      const date = typeof dateKey === "string" ? parseDateKey(dateKey) : dateKey;
      return date.toLocaleDateString("zh-CN", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      });
    }

    function getGreeting() {
      const hour = new Date().getHours();
      if (hour < 11) return "早上好";
      if (hour < 18) return "下午好";
      return "晚上好";
    }

    function summarizeFood(content) {
      const text = content.replace(/\s+/g, " ").trim();
      if (text.length <= 18) return text;
      return `${text.slice(0, 18)}…`;
    }

    function normalizeOtpCode(value) {
      return String(value || "").replace(/[^0-9a-z]/gi, "").slice(0, 12);
    }

    function hashString(value) {
      let hash = 0;
      for (let index = 0; index < value.length; index += 1) {
        hash = ((hash << 5) - hash) + value.charCodeAt(index);
        hash |= 0;
      }
      return hash;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function readCookie(name) {
      const prefix = `${name}=`;
      const match = document.cookie
        .split(";")
        .map((part) => part.trim())
        .find((part) => part.startsWith(prefix));
      return match ? decodeURIComponent(match.slice(prefix.length)) : "";
    }

    function writeCookie(name, value, maxAge) {
      try {
        const secure = location.protocol === "https:" ? "; Secure" : "";
        document.cookie = `${name}=${encodeURIComponent(value)}; Max-Age=${maxAge}; Path=/; SameSite=Lax${secure}`;
      } catch (error) {}
    }

    function clearCookie(name) {
      try {
        const secure = location.protocol === "https:" ? "; Secure" : "";
        document.cookie = `${name}=; Max-Age=0; Path=/; SameSite=Lax${secure}`;
      } catch (error) {}
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {
        toast.classList.remove("show");
      }, 1800);
    }

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
